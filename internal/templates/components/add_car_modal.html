{{ define "add_car_modal" }}

<div
    x-data="ui_component_modal('add-car')"
    x-show="isOpen"
    x-cloak
    x-transition
    class="fixed inset-0 z-50 flex items-center justify-center p-4"
>
    <div
        class="absolute inset-0 z-0 bg-black/80"
        x-on:click="close()"
    ></div>

    <div
        class="relative z-10 w-full max-w-lg border-[3px] border-neutral-100 bg-neutral-900 p-8 shadow-[8px_8px_0_0_#000] sm:max-w-xl"
        x-on:click.stop
    >
        <button
            type="button"
            x-on:click="close()"
            class="absolute top-6 right-6 flex size-11 cursor-pointer items-center justify-center border-2 border-neutral-100 bg-neutral-900 text-neutral-100 transition hover:-translate-y-0.5 hover:bg-neutral-100 hover:text-neutral-950"
        >
            {{ template "icon_x" "w-4 h-4" }}
        </button>

        <h2 class="mb-6 pr-12 text-sm font-extrabold tracking-widest text-neutral-100 uppercase">Novo veículo</h2>

        <form
            id="add-car-form"
            method="POST"
            action="/cars"
            x-data="{ loading: false }"
            x-on:turbo:submit-start="loading = true"
            x-on:turbo:submit-end="
                loading = false;
                if (event.detail.success) {
                    $el.reset();
                    close();
                }
            "
        >
            <div class="mb-4">
                <label class="mb-1 block text-xs tracking-widest text-neutral-500 uppercase">Título</label>
                <input
                    name="title"
                    required
                    class="w-full border-2 border-neutral-800 bg-neutral-950 px-3 py-2 text-sm text-neutral-100 focus:border-neutral-100 focus:outline-none"
                >
            </div>

            <div class="mb-4">
                <label class="mb-1 block text-xs tracking-widest text-neutral-500 uppercase">Tipo</label>
                <input
                    name="car_type"
                    required
                    placeholder="sedan, hatch, suv..."
                    class="w-full border-2 border-neutral-800 bg-neutral-950 px-3 py-2 text-sm text-neutral-100 placeholder:text-neutral-600 focus:border-neutral-100 focus:outline-none"
                >
            </div>

            <div class="mb-4">
                <label class="mb-1 block text-xs tracking-widest text-neutral-500 uppercase">KM</label>
                <input
                    type="number"
                    name="km"
                    required
                    class="w-full border-2 border-neutral-800 bg-neutral-950 px-3 py-2 text-sm text-neutral-100 focus:border-neutral-100 focus:outline-none"
                >
            </div>

            <div class="mt-6 flex justify-end gap-3">
                <button
                    type="button"
                    x-on:click="close()"
                    class="cursor-pointer border-2 border-neutral-100 bg-neutral-900 px-5.5 py-3.5 text-sm font-bold tracking-wide text-neutral-100 uppercase shadow-[5px_5px_0_0_#000] transition-transform hover:-translate-y-1 hover:-rotate-3"
                >
                    Cancelar
                </button>
                <button
                    type="submit"
                    x-bind:class="{ 'opacity-50 pointer-events-none cursor-not-allowed': loading }"
                    class="flex cursor-pointer items-center gap-2 border-2 border-neutral-100 bg-neutral-900 px-5.5 py-3.5 text-sm font-bold tracking-wide text-neutral-100 uppercase shadow-[5px_5px_0_0_#000] transition-transform hover:-translate-y-1 hover:-rotate-3"
                >
                    <span x-show="loading" class="inline-flex shrink-0">
                        {{ template "icon_loader" "w-4 h-4 animate-spin" }}
                    </span>
                    <span x-text="loading ? 'Cadastrando...' : 'Cadastrar'"></span>
                </button>
            </div>
        </form>
    </div>
</div>

{{ end }}
