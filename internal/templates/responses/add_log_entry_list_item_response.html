{{ define "add_log_entry_list_item_response" }}

{{ $logEntry := .LogEntry }}

{{ $totalCost := .TotalCost }}

{{ $carId := .CarID }}

{{ $logEntryCount := .LogEntryCount }}

<turbo-stream action="append" target="log-entries-list-{{ $carId }}">
    <template>
        {{ template "log_entry_list_item" $logEntry }}
    </template>
</turbo-stream>

<turbo-stream action="update" target="total-cost-{{ $carId }}">
    <template>
        total: {{ FmtCurrency $totalCost }}
    </template>
</turbo-stream>

<turbo-stream action="update" target="car-log-entry-count-{{ $carId }}">
    <template>
        {{ template "car_log_entry_count_text" $logEntryCount }}
    </template>
</turbo-stream>

{{ end }}
