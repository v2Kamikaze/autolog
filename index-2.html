<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>NeoCity Garage</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">

<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
        linear-gradient(
            180deg,
            #141414 0%,
            #0b0b0b 100%
        );

    font-family:'Inter', sans-serif;

    color:#f2f2f2;

    min-height:100vh;

    padding:60px 24px;
}

/* background texture */

body::before{

    content:"";

    position:fixed;
    inset:0;

    background-image:
        radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);

    background-size:6px 6px;

    opacity:.03;

    pointer-events:none;
}

/* layout */

.layout{

    width:min(1300px,100%);
    margin:auto;

    display:flex;
    flex-direction:column;

    gap:26px;
}

/* card */

.card{

    position:relative;

    background:#171717;

    border:3px solid #f2f2f2;

    overflow:hidden;

    box-shadow:
        8px 8px 0 #000;
}

/* top */

.card-header{

    position:relative;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:28px 34px;

    transition:.2s;
}

.card-header:hover{

    background:#1d1d1d;
}

/* racing stripe */

.card-header::before{

    content:"";

    position:absolute;

    top:0;
    bottom:0;
    right:170px;

    width:6px;

    background:#f2f2f2;
}

.card-header::after{

    content:"";

    position:absolute;

    top:0;
    bottom:0;
    right:158px;

    width:3px;

    background:#ff5f2e;
}

/* left */

.left{

    display:flex;
    align-items:center;

    gap:34px;
}

/* preview */

.preview{

    width:300px;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* car */

.car{

    position:relative;

    width:280px;
    height:82px;

    background:#2c2f36;

    border:3px solid #f2f2f2;

    transform:
        skewX(-18deg)
        rotate(-3deg);

    clip-path:polygon(
        0% 100%,
        8% 55%,
        22% 45%,
        36% 18%,
        68% 12%,
        84% 34%,
        100% 45%,
        100% 100%
    );

    box-shadow:
        8px 8px 0 #000;
}

.car::before{

    content:"";

    position:absolute;

    width:100px;
    height:20px;

    background:#f2f2f2;

    top:18px;
    left:78px;

    transform:skewX(-28deg);
}

.car::after{

    content:"";

    position:absolute;

    left:24px;
    right:24px;
    bottom:14px;

    height:8px;

    background:
        linear-gradient(
            90deg,
            #ff5f2e,
            #ffb84d,
            #3d6fff
        );
}

/* wheels */

.wheel{

    position:absolute;

    width:50px;
    height:50px;

    border-radius:50%;

    background:#000;

    bottom:-24px;

    border:3px solid #f2f2f2;
}

.wheel::before{

    content:"";

    position:absolute;

    inset:10px;

    border-radius:50%;

    background:#171717;
}

.w1{
    left:30px;
}

.w2{
    right:30px;
}

/* info */

.info{
    position:relative;
    z-index:2;
}

/* type */

.type{

    display:inline-flex;

    padding:8px 14px;

    background:#f2f2f2;

    color:#111;

    font-size:11px;

    font-weight:800;

    letter-spacing:2px;

    text-transform:uppercase;

    margin-bottom:18px;
}

/* title */

.title{

    font-size:72px;

    line-height:.85;

    font-weight:800;

    letter-spacing:-5px;

    transform:skewX(-8deg);
}

/* subtitle */

.subtitle{

    margin-top:10px;

    font-size:18px;

    color:#9c9c9c;

    font-weight:700;

    letter-spacing:3px;

    text-transform:uppercase;
}

/* stats */

.stats{

    display:flex;
    gap:14px;

    margin-top:24px;
}

.stat{

    padding:12px 16px;

    border:2px solid #f2f2f2;

    background:#0f0f0f;

    font-size:13px;

    font-weight:800;

    letter-spacing:1px;

    box-shadow:
        4px 4px 0 #000;
}

/* right */

.right{

    display:flex;
    align-items:center;

    gap:12px;

    position:relative;
    z-index:3;
}

/* buttons */

.button{

    width:44px;
    height:44px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:2px solid #f2f2f2;

    background:#171717;

    color:#fff;

    font-size:18px;

    font-weight:700;

    transition:.2s;

    cursor:pointer;
}

.button:hover{

    background:#f2f2f2;
    color:#111;

    transform:translateY(-2px);
}

.button.delete{

    background:#ff5f2e;

    border-color:#ff5f2e;
}

.button.delete:hover{

    background:#fff;
    border-color:#fff;
}

/* expand */

.expand{

    width:52px;
    height:52px;

    font-size:22px;
}

/* body */

.body{

    border-top:3px solid #f2f2f2;

    background:#111;

    padding:28px 34px;
}

/* top body */

.body-top{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:22px;
}

.body-title{

    font-size:12px;

    letter-spacing:4px;

    text-transform:uppercase;

    color:#8b8b8b;
}

.total{

    font-size:14px;

    font-weight:800;
}

/* maintenance list */

.maintenance-list{

    display:flex;
    flex-direction:column;

    gap:14px;
}

/* maintenance */

.maintenance{

    display:grid;

    grid-template-columns:
        2fr
        1fr
        1fr
        1fr
        auto;

    gap:18px;

    align-items:center;

    padding:18px;

    border:2px solid #262626;

    background:#171717;

    transition:.2s;
}

.maintenance:hover{

    border-color:#f2f2f2;

    transform:translateX(4px);
}

/* service */

.service{

    display:flex;
    flex-direction:column;
    gap:4px;
}

.service-name{

    font-size:15px;

    font-weight:700;
}

.service-type{

    font-size:11px;

    letter-spacing:2px;

    text-transform:uppercase;

    color:#777;
}

/* labels */

.label{

    font-size:10px;

    letter-spacing:2px;

    text-transform:uppercase;

    color:#777;

    margin-bottom:4px;
}

.value{

    font-size:14px;

    font-weight:700;
}

/* actions */

.actions{

    display:flex;
    gap:8px;
}

/* responsive */

@media(max-width:1100px){

    .card-header{

        flex-direction:column;
        align-items:flex-start;

        gap:40px;
    }

    .left{

        flex-direction:column;
        align-items:flex-start;
    }

    .preview{

        width:100%;
        justify-content:flex-start;
    }

    .maintenance{

        grid-template-columns:1fr;
    }

}

@media(max-width:700px){

    .title{
        font-size:52px;
    }

    .car{
        width:220px;
    }

}

</style>
</head>

<body>

<section class="layout">

    <!-- CARD -->

    <div class="card" x-data="{ open: false }">

        <!-- HEADER -->

        <div
            class="card-header"
            @click="open = !open"
        >

            <!-- LEFT -->

            <div class="left">

                <!-- CAR -->

                <div class="preview">

                    <div class="car">

                        <div class="wheel w1"></div>
                        <div class="wheel w2"></div>

                    </div>

                </div>

                <!-- INFO -->

                <div class="info">

                    <div class="type">
                        hatch
                    </div>

                    <div class="title">
                        civic
                    </div>

                    <div class="subtitle">
                        type-r aero
                    </div>

                    <div class="stats">

                        <div class="stat">
                            82.400 km
                        </div>

                        <div class="stat">
                            12 maintenances
                        </div>

                    </div>

                </div>

            </div>

            <!-- RIGHT -->

            <div class="right">

                <button class="button">
                    +
                </button>

                <button class="button">
                    ✎
                </button>

                <button class="button delete">
                    ×
                </button>

                <button
                    class="button expand"
                    :style="open ? 'transform:rotate(45deg)' : ''"
                >
                    +
                </button>

            </div>

        </div>

        <!-- BODY -->

        <div
            class="body"
            x-show="open"
            x-transition
        >

            <!-- TOP -->

            <div class="body-top">

                <div class="body-title">
                    maintenance history
                </div>

                <div class="total">
                    total: R$ 8.420
                </div>

            </div>

            <!-- LIST -->

            <div class="maintenance-list">

                <!-- ITEM -->

                <div class="maintenance">

                    <div class="service">

                        <div class="service-name">
                            Troca de óleo
                        </div>

                        <div class="service-type">
                            engine maintenance
                        </div>

                    </div>

                    <div>

                        <div class="label">
                            Date
                        </div>

                        <div class="value">
                            12/02/2026
                        </div>

                    </div>

                    <div>

                        <div class="label">
                            KM
                        </div>

                        <div class="value">
                            80.000
                        </div>

                    </div>

                    <div>

                        <div class="label">
                            Cost
                        </div>

                        <div class="value">
                            R$ 320
                        </div>

                    </div>

                    <div class="actions">

                        <button class="button">
                            ✎
                        </button>

                        <button class="button delete">
                            ×
                        </button>

                    </div>

                </div>

                <!-- ITEM -->

                <div class="maintenance">

                    <div class="service">

                        <div class="service-name">
                            Suspensão esportiva
                        </div>

                        <div class="service-type">
                            street setup
                        </div>

                    </div>

                    <div>

                        <div class="label">
                            Date
                        </div>

                        <div class="value">
                            03/01/2026
                        </div>

                    </div>

                    <div>

                        <div class="label">
                            KM
                        </div>

                        <div class="value">
                            76.000
                        </div>

                    </div>

                    <div>

                        <div class="label">
                            Cost
                        </div>

                        <div class="value">
                            R$ 2.800
                        </div>

                    </div>

                    <div class="actions">

                        <button class="button">
                            ✎
                        </button>

                        <button class="button delete">
                            ×
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

</body>
</html>
