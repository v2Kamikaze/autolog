{{ define "base_page" }}
<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
          }
        } catch (_) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <link rel="stylesheet" href="/static/css/output.css" />
    <script defer src="/static/js/alpinejs@3.15.12.min.js"></script>
    <script src="/static/js/turbo.es2017-umd.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>

    <title>Autolog</title>
  </head>

  <body
    class="
      min-h-screen overflow-x-hidden
      font-sans text-neutral-900
      bg-linear-to-b from-neutral-100 to-neutral-200
      before:fixed before:inset-0 before:bg-[radial-gradient(rgba(0,0,0,0.12)_1px,transparent_1px)] before:bg-size-[6px_6px] before:opacity-[0.04] before:pointer-events-none before:content-['']
      dark:text-neutral-100 dark:from-neutral-900 dark:to-neutral-950
      dark:before:bg-[radial-gradient(rgba(255,255,255,0.08)_1px,transparent_1px)] dark:before:opacity-[0.03]
    "
  >
    <div class="pointer-events-none fixed top-10 -left-5 z-0 select-none text-[240px] leading-none font-extrabold text-neutral-900/[0.03] dark:text-white/[0.03]" aria-hidden="true">速</div>
    <div class="pointer-events-none fixed right-5 bottom-5 z-0 select-none text-[240px] leading-none font-extrabold text-neutral-900/[0.03] dark:text-white/[0.03]" aria-hidden="true">車</div>

    <div class="mx-auto max-w-7xl px-6 py-10">
      {{ block "content" . }}
      {{ end }}
    </div>

    {{ block "modals" . }}
    {{ end }}
  </body>
</html>
{{ end }}
