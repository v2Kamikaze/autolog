{{ define "edit_log_stream" }}
<turbo-stream action="replace" target="log-entries-list-item-{{ .LogEntry.ID }}">
  <template>
    {{ template "log_list_item" .LogEntry }}
  </template>
</turbo-stream>

<turbo-stream action="update" target="total-cost-{{ .LogEntry.VehicleID }}">
  <template>
    {{ template "log_entry_amount_text" .Vehicle }}
  </template>
</turbo-stream>
{{ end }}
