{{ define "navigation_bar" }}

<section class="relative mb-12">

  <div class="mb-8">

    <div class="text-center text-neutral-900 dark:text-amber-50">

      <div class="mx-auto mb-6 w-64 sm:w-80">
        <div class="w-0 border-t-[3px] border-double border-neutral-900/30 animate-[expand-fade-in_.5s_ease_0s_both] dark:border-amber-50/60"></div>
      </div>

      <h1 aria-label="Autolog logo" class="font-display text-5xl leading-none font-black tracking-[-0.04em] uppercase sm:text-7xl md:text-8xl">
        <span class="inline-block animate-[slide-down-fade-in_.5s_ease_0s_both]">A</span>
        <span class="inline-block animate-[slide-down-fade-in_.5s_ease_.075s_both]">u</span>
        <span class="inline-block animate-[slide-down-fade-in_.5s_ease_.15s_both]">t</span>
        <span class="inline-block animate-[slide-down-fade-in_.5s_ease_.225s_both]">o</span>
        <span class="inline-block animate-[slide-down-fade-in_.5s_ease_.3s_both]">l</span>
        <span class="inline-block animate-[slide-down-fade-in_.5s_ease_.375s_both]">o</span>
        <span class="inline-block animate-[slide-down-fade-in_.5s_ease_.45s_both]">g</span>
      </h1>

      <div class="mt-3 text-xs tracking-[0.35em] uppercase sm:text-xs animate-[slide-down-fade-in_.8s_ease_.7s_both]">
        Registros de despesas veiculares
      </div>

      <div class="mx-auto mt-5 w-64 sm:w-80">
        <div class="w-0 border-t-[3px] border-double border-neutral-900/30 animate-[expand-fade-in_.9s_ease_1s_both] dark:border-amber-50/60"></div>
      </div>

    </div>

  </div>

  <nav class="flex justify-center animate-[slide-up-fade-in_.7s_ease_1.1s_both]">

    <ul class="flex items-center justify-center gap-3.5">

      <li>
        <button
          type="button"
          x-data="theme_switch"
          x-on:click="toggle()"
          x-bind:title="dark ? 'Ativar tema claro' : 'Ativar tema escuro'"
          x-bind:aria-label="dark ? 'Ativar tema claro' : 'Ativar tema escuro'"
          class="flex size-12 cursor-pointer items-center justify-center border border-neutral-900/70 bg-amber-50 text-neutral-900 shadow-lg transition duration-250 hover:-translate-y-1 dark:border-neutral-200/30 dark:bg-neutral-900 dark:text-neutral-100"
        >

          <span x-show="dark" x-cloak>
            {{ template "icon_sun" "w-5 h-5" }}
          </span>

          <span x-show="!dark" x-cloak>
            {{ template "icon_moon" "w-5 h-5" }}
          </span>

        </button>

      </li>

      <li>

        <button
          type="button"
          x-data
          x-on:click="$dispatch('open-modal', { modalId: 'add-vehicle', data: {} })"
          class="h-12 cursor-pointer border border-neutral-900/70 bg-amber-50 px-5 py-3 text-sm font-bold tracking-wide text-neutral-900 uppercase shadow-lg transition duration-250 hover:-translate-y-1 dark:border-neutral-200/30 dark:bg-neutral-900 dark:text-neutral-100"
        >
          Cadastrar novo veículo
        </button>

      </li>

    </ul>

  </nav>

</section>

{{ end }}
