{{ define "log_list_item" }}

{{ $entry := . }}

<div
  id="log-entries-list-item-{{ $entry.ID }}"
  class="border-b border-dashed border-neutral-400 py-4 dark:border-white/15"
>
  <div class="flex items-start justify-between gap-4">
    <div class="min-w-0 flex-1">
      <div class="flex flex-wrap items-center gap-2">
        <div class="text-sm font-bold uppercase text-neutral-900 dark:text-amber-50">
          {{ $entry.Name }}
        </div>

        <div class="text-[10px] tracking-widest text-neutral-500 uppercase dark:text-stone-400">
          {{ $entry.Type.Label }}
        </div>
      </div>

      <div class="mt-1 text-xs tracking-widest text-neutral-500 uppercase dark:text-stone-400">
        {{ FmtDate $entry.Date }} • {{ $entry.KM }} KM
      </div>

      {{ if $entry.Notes }}
      <div class="mt-2 text-sm text-neutral-600 dark:text-stone-400">
        {{ $entry.Notes }}
      </div>
      {{ end }}
    </div>

    <div class="flex shrink-0 flex-col items-end">
      <div class="font-['Playfair_Display',serif] text-2xl leading-none font-bold text-neutral-900 dark:text-amber-50">
        {{ FmtCurrency $entry.Cost }}
      </div>

      <div class="mt-3 flex gap-2">
        <button
          type="button"
          title="Editar log"
          class="flex size-9 cursor-pointer items-center justify-center border border-neutral-900/70 bg-amber-50 text-neutral-900 transition hover:-translate-y-0.5 dark:border-neutral-100/50 dark:bg-neutral-950 dark:text-neutral-100"
          x-on:click="$dispatch('open-modal', {
              modalId: 'edit-log-entry',
              data: {
                  id: {{ $entry.ID }},
                  vehicleId: {{ $entry.VehicleID }},
                  name: {{ JsQuote $entry.Name }},
                  notes: {{ JsQuote $entry.Notes }},
                  entryType: {{ JsQuote (printf "%s" $entry.Type) }},
                  date: {{ JsQuote (ToDate $entry.Date) }},
                  km: {{ $entry.KM }},
                  cost: {{ $entry.Cost }}
              }
          })"
        >
          {{ template "icon_edit" "w-4 h-4" }}
        </button>

        <button
          type="button"
          title="Excluir log"
          class="flex size-9 cursor-pointer items-center justify-center border border-red-700/70 bg-red-700 text-neutral-100 transition hover:-translate-y-0.5 dark:border-red-400/50 dark:bg-red-500/80"
          x-on:click="$dispatch('open-modal', {
              modalId: 'delete-log-entry',
              data: {
                  vehicleId: {{ $entry.VehicleID }},
                  logEntryId: {{ $entry.ID }},
                  name: {{ JsQuote $entry.Name }},
                  typeLabel: {{ JsQuote $entry.Type.Label }},
                  date: {{ JsQuote (FmtDate $entry.Date) }},
                  km: {{ $entry.KM }},
                  cost: {{ $entry.Cost }}
              }
          })"
        >
          {{ template "icon_x" "w-4 h-4" }}
        </button>
      </div>
    </div>
  </div>
</div>

{{ end }}
