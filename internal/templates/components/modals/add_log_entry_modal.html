{{ define "add_log_entry_modal" }}

<div
    x-data="ui_component_modal('add-log-entry')"
    x-show="isOpen"
    x-cloak
    x-transition
    class="fixed inset-0 z-50 flex items-center justify-center p-4"
>
    <div
        class="absolute inset-0 z-0 bg-black/80"
        x-on:click="close()"
    ></div>

    <div
        class="relative z-10 w-full max-w-lg border-[3px] border-neutral-900 bg-neutral-50 dark:border-neutral-100 dark:bg-neutral-900 p-8 shadow-[8px_8px_0_0_#000]"
        x-on:click.stop
    >
        <button
            type="button"
            x-on:click="close()"
            class="absolute top-6 right-6 flex size-11 cursor-pointer items-center justify-center border-2 border-neutral-900 bg-neutral-50 text-neutral-900 transition hover:-translate-y-0.5 hover:bg-neutral-900 hover:text-neutral-50 dark:border-neutral-100 dark:bg-neutral-900 dark:text-neutral-100 dark:hover:bg-neutral-100 dark:hover:text-neutral-950"
        >
            {{ template "icon_x" "w-4 h-4" }}
        </button>

        <h2 class="mb-6 pr-12 text-sm font-extrabold tracking-widest text-neutral-900 uppercase dark:text-neutral-100">Novo log</h2>

        <form
            method="POST"
            x-data="{
                loading: false,
                cents: 0,
                formatCents(cents) {
                    return (cents / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
                },
                handleInput(e) {
                    const raw = e.target.value.replace(/\D/g, '')
                    this.cents = raw ? parseInt(raw, 10) : 0
                    e.target.value = this.formatCents(this.cents)
                }
            }"
            x-bind:action="`/vehicles/${data.vehicleId}/log-entries`"
            x-on:turbo:submit-start="loading = true"
            x-on:turbo:submit-end="
                loading = false;
                if (event.detail.success) {
                    $el.reset();
                    cents = 0;
                    close();
                }
            "
        >
            <div class="mb-4">
                <label class="mb-1 block text-xs tracking-widest text-neutral-500 uppercase">Tipo</label>
                <select
                    name="entry_type"
                    required
                    class="w-full border-2 border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-900 focus:border-neutral-900 dark:border-neutral-800 dark:bg-neutral-950 dark:text-neutral-100 dark:focus:border-neutral-100 focus:outline-none"
                >
                    <option value="maintenance">Manutenção</option>
                    <option value="expense">Despesa</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="mb-1 block text-xs tracking-widest text-neutral-500 uppercase">Nome</label>
                <input
                    name="name"
                    required
                    placeholder="Troca de óleo, Gasolina..."
                    class="w-full border-2 border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-900 placeholder:text-neutral-600 focus:border-neutral-900 dark:border-neutral-800 dark:bg-neutral-950 dark:text-neutral-100 dark:focus:border-neutral-100 focus:outline-none"
                >
            </div>

            <div class="mb-4">
                <label class="mb-1 block text-xs tracking-widest text-neutral-500 uppercase">Data</label>
                <input
                    type="date"
                    name="date"
                    required
                    class="w-full border-2 border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-900 focus:border-neutral-900 dark:border-neutral-800 dark:bg-neutral-950 dark:text-neutral-100 dark:focus:border-neutral-100 focus:outline-none"
                >
            </div>

            <div class="mb-4">
                <label class="mb-1 block text-xs tracking-widest text-neutral-500 uppercase">KM</label>
                <input
                    type="number"
                    name="km"
                    required
                    class="w-full border-2 border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-900 focus:border-neutral-900 dark:border-neutral-800 dark:bg-neutral-950 dark:text-neutral-100 dark:focus:border-neutral-100 focus:outline-none"
                >
            </div>

            <div class="mb-4">
                <label class="mb-1 block text-xs tracking-widest text-neutral-500 uppercase">Valor</label>
                <input
                    type="text"
                    inputmode="numeric"
                    placeholder="R$ 0,00"
                    x-on:input="handleInput"
                    class="w-full border-2 border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-900 placeholder:text-neutral-600 focus:border-neutral-900 dark:border-neutral-800 dark:bg-neutral-950 dark:text-neutral-100 dark:focus:border-neutral-100 focus:outline-none"
                >
                <input type="hidden" name="cost" x-model="cents">
            </div>

            <div class="mt-6 flex justify-end gap-3">
                <button
                    type="button"
                    x-on:click="close()"
                    class="cursor-pointer border-2 border-neutral-900 bg-neutral-50 px-5.5 py-3.5 text-sm font-bold tracking-wide text-neutral-900 uppercase dark:border-neutral-100 dark:bg-neutral-900 dark:text-neutral-100 shadow-[5px_5px_0_0_#000] transition-transform hover:-translate-y-1 hover:-rotate-3"
                >
                    Cancelar
                </button>
                <button
                    type="submit"
                    x-bind:class="{ 'opacity-50 pointer-events-none cursor-not-allowed': loading }"
                    class="flex cursor-pointer items-center gap-2 border-2 border-neutral-900 bg-neutral-50 px-5.5 py-3.5 text-sm font-bold tracking-wide text-neutral-900 uppercase dark:border-neutral-100 dark:bg-neutral-900 dark:text-neutral-100 shadow-[5px_5px_0_0_#000] transition-transform hover:-translate-y-1 hover:-rotate-3"
                >
                    <span x-show="loading" class="inline-flex shrink-0">
                        {{ template "icon_loader" "w-4 h-4 animate-spin" }}
                    </span>
                    <span x-text="loading ? 'Salvando...' : 'Salvar'"></span>
                </button>
            </div>
        </form>
    </div>
</div>

{{ end }}
