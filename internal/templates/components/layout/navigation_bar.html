{{ define "navigation_bar" }}

<section class="relative mb-12">
  <div class="mb-8">
    {{ template "logo" }}
  </div>

  <nav class="flex justify-center">
    <ul class="flex flex-wrap items-center justify-center gap-3.5">
      <li>
        <button
          type="button"
          x-data="theme_switch"
          x-on:click="toggle()"
          x-bind:title="dark ? 'Ativar tema claro' : 'Ativar tema escuro'"
          x-bind:aria-label="dark ? 'Ativar tema claro' : 'Ativar tema escuro'"
          class="flex size-[52px] cursor-pointer items-center justify-center border border-neutral-900/70 bg-amber-50 text-neutral-900 shadow-lg transition duration-250 hover:-translate-y-1 hover:rotate-1 dark:border-neutral-200/30 dark:bg-neutral-900 dark:text-neutral-100"
        >
          <span x-show="dark" x-cloak>{{ template "icon_sun" "w-5 h-5" }}</span>
          <span x-show="!dark" x-cloak>{{ template "icon_moon" "w-5 h-5" }}</span>
        </button>
      </li>
      <li>
        <button
          type="button"
          x-data
          x-on:click="$dispatch('open-modal', { modalId: 'add-vehicle', data: {} })"
          class="cursor-pointer border border-neutral-900/70 bg-amber-50 px-5 py-3 text-sm font-bold tracking-wide text-neutral-900 uppercase shadow-lg transition duration-250 hover:-translate-y-1 hover:-rotate-1 dark:border-neutral-200/30 dark:bg-neutral-900 dark:text-neutral-100"
        >
          Cadastrar novo veículo
        </button>
      </li>
    </ul>
  </nav>
</section>

{{ end }}
