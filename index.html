<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>NeoCity Tokyo Garage</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
        linear-gradient(
            180deg,
            #141414 0%,
            #0b0b0b 100%
        );

    font-family:'Inter', sans-serif;

    color:#f2f2f2;

    min-height:100vh;

    overflow-x:hidden;
}

/* subtle grain */

body::before{

    content:"";

    position:fixed;
    inset:0;

    background-image:
        radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);

    background-size:6px 6px;

    opacity:.03;

    pointer-events:none;
}

/* background japanese blocks */

.bg-kanji{

    position:fixed;

    font-size:240px;

    font-weight:800;

    color:rgba(255,255,255,.03);

    line-height:1;

    user-select:none;

    pointer-events:none;
}

.k1{
    top:40px;
    left:-20px;
}

.k2{
    bottom:20px;
    right:20px;
}

/* top */

.top{

    width:min(1300px,92%);
    margin:50px auto 40px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

/* logo */

.logo{

    font-size:96px;

    font-weight:800;

    letter-spacing:-8px;

    line-height:.85;

    text-transform:lowercase;

    transform:skewX(-12deg);
}

.logo span{

    display:block;

    position:relative;

    color:#f5f5f5;
}

/* layered offset */

.logo span::before{

    content:attr(data-text);

    position:absolute;

    left:6px;
    top:4px;

    color:#ff5f2e;

    z-index:-1;
}

.logo span::after{

    content:attr(data-text);

    position:absolute;

    left:12px;
    top:8px;

    color:#3d6fff;

    z-index:-2;
}

/* subtitle */

.subtitle{

    margin-top:18px;

    color:#7c7c7c;

    font-size:13px;

    letter-spacing:5px;

    text-transform:uppercase;
}

/* nav */

.nav{

    display:flex;
    gap:14px;
}

.nav-item{

    padding:14px 22px;

    border:2px solid #f2f2f2;

    background:#181818;

    font-size:14px;

    font-weight:700;

    letter-spacing:1px;

    text-transform:uppercase;

    box-shadow:
        5px 5px 0 #000;
}

/* layout */

.layout{

    width:min(1300px,92%);
    margin:auto;

    display:flex;
    flex-direction:column;

    gap:26px;

    padding-bottom:80px;
}

/* card */

.card{

    position:relative;

    background:#171717;

    border:3px solid #f2f2f2;

    min-height:220px;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:36px;

    transition:.25s;

    box-shadow:
        8px 8px 0 #000;
}

.card:hover{

    transform:
        translateY(-4px)
        rotate(-.3deg);
}

/* racing stripe */

.card::before{

    content:"";

    position:absolute;

    top:0;
    bottom:0;
    right:160px;

    width:6px;

    background:#f2f2f2;
}

.card::after{

    content:"";

    position:absolute;

    top:0;
    bottom:0;
    right:148px;

    width:3px;

    background:#ff5f2e;
}

/* left */

.info{
    position:relative;
    z-index:2;
}

.type{

    display:inline-block;

    padding:8px 14px;

    border:2px solid #f2f2f2;

    background:#f2f2f2;

    color:#111;

    font-size:12px;

    font-weight:800;

    letter-spacing:2px;

    text-transform:uppercase;

    margin-bottom:18px;
}

/* big car name */

.name{

    font-size:84px;

    line-height:.85;

    font-weight:800;

    text-transform:lowercase;

    letter-spacing:-6px;

    transform:skewX(-8deg);

    color:#fff;
}

/* model */

.model{

    margin-top:10px;

    font-size:20px;

    color:#9c9c9c;

    font-weight:700;

    letter-spacing:3px;

    text-transform:uppercase;
}

/* km */

.km{

    margin-top:26px;

    display:inline-flex;
    align-items:center;
    gap:12px;

    padding:14px 18px;

    border:2px solid #f2f2f2;

    background:#0f0f0f;

    font-weight:800;

    color:#fff;

    box-shadow:
        4px 4px 0 #000;
}

/* preview */

.preview{

    width:36%;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
}

/* stronger 2D silhouette */

.car{

    position:relative;

    width:340px;
    height:90px;

    background:#2c2f36;

    border:3px solid #f2f2f2;

    transform:
        skewX(-18deg)
        rotate(-3deg);

    clip-path:polygon(
        0% 100%,
        8% 55%,
        22% 45%,
        36% 18%,
        68% 12%,
        84% 34%,
        100% 45%,
        100% 100%
    );

    box-shadow:
        8px 8px 0 #000;
}

/* roof line */

.car::before{

    content:"";

    position:absolute;

    width:120px;
    height:24px;

    background:#f2f2f2;

    top:22px;
    left:96px;

    transform:skewX(-28deg);
}

/* side graphics */

.car::after{

    content:"";

    position:absolute;

    left:30px;
    right:30px;
    bottom:18px;

    height:10px;

    background:
        linear-gradient(
            90deg,
            #ff5f2e 0%,
            #ffb84d 50%,
            #3d6fff 100%
        );
}

/* wheels */

.wheel{

    position:absolute;

    width:58px;
    height:58px;

    border-radius:50%;

    background:#000;

    bottom:-28px;

    border:3px solid #f2f2f2;
}

.wheel::before{

    content:"";

    position:absolute;

    inset:12px;

    border-radius:50%;

    background:#171717;
}

.w1{
    left:42px;
}

.w2{
    right:42px;
}

/* japanese badge */

.badge{

    position:absolute;

    top:22px;
    right:22px;

    writing-mode:vertical-rl;

    font-size:14px;

    font-weight:800;

    letter-spacing:2px;

    text-transform:uppercase;

    color:#f2f2f2;
}

/* responsive */

@media(max-width:1000px){

    .card{
        flex-direction:column;
        align-items:flex-start;
        gap:40px;
    }

    .preview{
        width:100%;
    }

}

@media(max-width:700px){

    .top{
        flex-direction:column;
        gap:30px;
    }

    .logo{
        font-size:58px;
    }

    .name{
        font-size:52px;
    }

    .car{
        width:260px;
    }

}

</style>
</head>

<body>

<div class="bg-kanji k1">速</div>
<div class="bg-kanji k2">東</div>

<section class="top">

    <div>

        <div class="logo">

            <span data-text="neocity">
                neocity
            </span>

        </div>

        <div class="subtitle">
            tokyo underground tuning archive
        </div>

    </div>

    <div class="nav">

        <div class="nav-item">
            Garage
        </div>

        <div class="nav-item">
            Stock
        </div>

        <div class="nav-item">
            Drift
        </div>

    </div>

</section>

<section class="layout">

    <div class="card">

        <div class="badge">
            tokyo
        </div>

        <div class="info">

            <div class="type">
                hatch
            </div>

            <div class="name">
                civic
            </div>

            <div class="model">
                type-r aero
            </div>

            <div class="km">
                82.400 km
            </div>

        </div>

        <div class="preview">

            <div class="car">

                <div class="wheel w1"></div>
                <div class="wheel w2"></div>

            </div>

        </div>

    </div>

    <div class="card">

        <div class="badge">
            jdm
        </div>

        <div class="info">

            <div class="type">
                sedan
            </div>

            <div class="name">
                altezza
            </div>

            <div class="model">
                rs200 touring
            </div>

            <div class="km">
                64.120 km
            </div>

        </div>

        <div class="preview">

            <div class="car" style="background:#2f2522;">

                <div class="wheel w1"></div>
                <div class="wheel w2"></div>

            </div>

        </div>

    </div>

</section>

</body>
</html>
