{{ define "base_page" }}
<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
          }
        } catch (_) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <link rel="stylesheet" href="/static/css/output.css" />
    <script defer src="/static/js/alpinejs@3.15.12.min.js"></script>
    <script src="/static/js/turbo.es2017-umd.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />

    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>

    <title>Autolog</title>
  </head>

  <body
    class="
      min-h-screen overflow-x-hidden p-6 md:p-12
      font-['Libre_Baskerville',serif] text-neutral-900
      bg-linear-to-br from-amber-800 to-stone-900
      before:fixed before:inset-0 before:bg-[repeating-linear-gradient(90deg,rgba(0,0,0,0.05)_0px,rgba(0,0,0,0.05)_2px,transparent_2px,transparent_14px)] before:pointer-events-none before:content-['']
      dark:text-amber-50 dark:from-stone-900 dark:to-stone-950 dark:before:bg-[repeating-linear-gradient(90deg,rgba(255,255,255,0.015)_0px,rgba(255,255,255,0.015)_2px,transparent_2px,transparent_12px)]
    "
  >
    <div class="mx-auto max-w-[1400px]">
      {{ block "content" . }}
      {{ end }}
    </div>

    {{ block "modals" . }}
    {{ end }}
  </body>
</html>
{{ end }}
