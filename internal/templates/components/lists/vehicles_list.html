{{ define "vehicles_list" }}

{{ $vehicles := . }}

<div id="vehicles-list" class="mx-auto grid w-full max-w-350 grid-cols-1 gap-11 lg:grid-cols-2 items-start animate-[slide-up-fade-in_.7s_ease_1.35s_both]">
  {{ if $vehicles}}
    {{ range $vehicles }}
      {{ template "vehicles_list_item" . }}
    {{ end }}
  {{ else }}
    {{ template "vehicles_list_empty" }}
  {{ end }}
</div>

{{ end }}
