{{ define "car_list" }}

{{ $cars := . }}

<div id="cars-list" class="mx-auto flex w-full max-w-[1300px] flex-col gap-7">
    {{ if $cars}}
        {{ range $cars }}
            {{ template "car_list_item" . }}
        {{ end }}
    {{ else }}
        <p class="text-sm text-neutral-500">Ainda não possui nenhum veículo registrado.</p>
    {{ end }}
</div>

{{ end }}
