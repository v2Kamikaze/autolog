{{ define "delete_log_entry_modal" }}

<div
    x-data="ui_component_modal('delete-log-entry')"
    x-show="isOpen"
    x-cloak
    x-transition
    class="fixed inset-0 z-50 flex items-center justify-center p-4"
>
    <div
        class="absolute inset-0 z-0 bg-black/80"
        x-on:click="close()"
    ></div>

    <div
        class="relative z-10 w-full max-w-lg border-[3px] border-neutral-900 bg-neutral-50 dark:border-neutral-100 dark:bg-neutral-900 p-8 shadow-[8px_8px_0_0_#000] sm:max-w-xl"
        x-on:click.stop
    >
        <button
            type="button"
            x-on:click="close()"
            class="absolute top-6 right-6 flex size-11 cursor-pointer items-center justify-center border-2 border-neutral-900 bg-neutral-50 text-neutral-900 transition hover:-translate-y-0.5 hover:bg-neutral-900 hover:text-neutral-50 dark:border-neutral-100 dark:bg-neutral-900 dark:text-neutral-100 dark:hover:bg-neutral-100 dark:hover:text-neutral-950"
        >
            {{ template "icon_x" "w-4 h-4" }}
        </button>

        <h2 class="mb-4 pr-12 text-sm font-extrabold tracking-widest text-neutral-900 uppercase dark:text-neutral-100">Excluir log</h2>
        <p class="mb-6 text-sm text-neutral-600 dark:text-neutral-400" x-text="`${data.name} (${data.date}) - ${data.km} km - ${(data.cost / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}`"></p>

        <form
            method="DELETE"
            x-data="{ loading: false }"
            x-bind:action="`/vehicles/${data.vehicleId}/log-entries/${data.logEntryId}`"
            x-on:turbo:submit-start="loading = true"
            x-on:turbo:submit-end="
                loading = false;
                if (event.detail.success) {
                    close();
                }
            "
        >
            <div class="flex justify-end gap-3">
                <button
                    type="button"
                    x-on:click="close()"
                    class="cursor-pointer border-2 border-neutral-900 bg-neutral-50 px-5.5 py-3.5 text-sm font-bold tracking-wide text-neutral-900 uppercase dark:border-neutral-100 dark:bg-neutral-900 dark:text-neutral-100 shadow-[5px_5px_0_0_#000] transition-transform hover:-translate-y-1 hover:-rotate-3"
                >
                    Cancelar
                </button>
                <button
                    type="submit"
                    x-bind:class="{ 'opacity-50 pointer-events-none cursor-not-allowed': loading }"
                    class="flex cursor-pointer items-center gap-2 border-2 border-orange-500 bg-orange-500 px-5.5 py-3.5 text-sm font-bold tracking-wide text-neutral-100 uppercase shadow-[5px_5px_0_0_#000] transition-transform hover:-translate-y-1 hover:-rotate-3 hover:border-white hover:bg-white hover:text-neutral-950"
                >
                    <span x-show="loading" class="inline-flex shrink-0">
                        {{ template "icon_loader" "w-4 h-4 animate-spin" }}
                    </span>
                    <span x-text="loading ? 'Excluindo...' : 'Excluir'"></span>
                </button>
            </div>
        </form>
    </div>
</div>

{{ end }}
