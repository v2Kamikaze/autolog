{{ define "log_list" }}

{{ $vehicle := . }}
{{ $logEntries := $vehicle.LogEntries }}

<div>
  <div class="mb-4 border-b-2 border-neutral-900 pb-2 font-['Playfair_Display',serif] text-2xl uppercase dark:border-stone-600 dark:text-amber-50">Registros de serviço</div>

  <div id="log-entries-list-{{ $vehicle.ID }}" class="flex flex-col gap-3">
    {{ if $logEntries }}
      {{ range $logEntries }}
        {{ template "log_list_item" . }}
      {{ end }}
    {{ else }}
      <p class="text-sm text-neutral-500 dark:text-stone-400">Sem logs registrados.</p>
    {{ end }}
  </div>

  {{ template "log_entry_amount_text" $vehicle }}
</div>

{{ end }}
